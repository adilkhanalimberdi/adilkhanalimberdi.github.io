server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  application:
    name: backend

  datasource:
    url: jdbc:postgresql://localhost:5432/backend
    username: ${DB_USER}
    password: ${DB_PASS}

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false