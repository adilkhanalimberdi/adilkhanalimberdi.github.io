spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  jwt:
    secret-key: ${JWT_SECRET_KEY}
    expiration:
      access-minutes: ${JWT_EXPIRATION_ACCESS_MINUTES}
      refresh-minutes: ${JWT_EXPIRATION_REFRESH_MINUTES}

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health