spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  jwt:
    secret-key: ${JWT_SECRET_KEY}
    expiration:
      access-minutes: ${JWT_EXPIRATION_ACCESS_MINUTES}
      refresh-minutes: ${JWT_EXPIRATION_REFRESH_MINUTES}
  admin:
    username: admin
    email: ${ADMIN_EMAIL}
    password: ${ADMIN_PASSWORD}
  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN}
    chat-id: ${TELEGRAM_CHAT_ID}
  cookie:
    secure: true
    same-site: "None"
    partitioned: true

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health